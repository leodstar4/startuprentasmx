# Render blueprint — Renta MX DEMO (monolito Python: FastAPI sirve /mx/* + frontend estático)
#
# DEMO: corpus recortado a CDMX + Federal (69 requisitos verificados) para caber en 512 MB RAM.
# PRODUCCIÓN: quitar MX_DATA_DIR y MX_CORPUS_DIR → usa data/mx (229 reqs) + corpus_mx (85 docs).
#             Cambiar plan a `starter` (~$7/mes) para evitar cold starts y tener 2 GB RAM.
#
# Regla Cero: python -m mx.verify corre en el build; una cita rota falla el deploy.
# No LLM, no red en runtime.

services:
  - type: web
    name: renta-mx-demo
    runtime: python
    plan: free    # ← cambiar a `starter` para producción (no se duerme, 2 GB RAM)
    buildCommand: >-
      pip install -r requirements.txt &&
      MX_DATA_DIR=data/mx_demo MX_CORPUS_DIR=corpus_demo OUT_DIR=/tmp/mx_verify python -m mx.verify &&
      curl -fsSL https://bun.sh/install | bash &&
      export PATH="$HOME/.bun/bin:$PATH" &&
      cd frontend && VITE_IS_DEMO=true bun install && bun run build && cd ..
    startCommand: >-
      uvicorn api.main:app
      --host 0.0.0.0
      --port $PORT
      --proxy-headers
      --forwarded-allow-ips='*'
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      # DEMO: corpus recortado. Quitar para producción completa.
      - key: MX_DATA_DIR
        value: data/mx_demo
      - key: MX_CORPUS_DIR
        value: corpus_demo

      # Donde vive el build del frontend (StaticFiles en api/main.py).
      - key: FRONTEND_DIST
        value: frontend/.output/public

      # Banner de demo en el frontend.
      - key: VITE_IS_DEMO
        value: "true"

      # Orígenes CORS extra (el monolito sirve mismo origen; solo para dev split).
      - key: ALLOWED_ORIGINS
        value: ""

      # Sal para el hash de IP en evidencia de firma. Render la genera; mantener estable.
      - key: MX_IP_SALT
        generateValue: true

      # Base de datos persistente (Supabase Postgres).
      # Pegar la connection string de: Supabase → Settings → Database → URI
      # Sin definir = store JSON efímero (datos se pierden al reiniciar).
      - key: DATABASE_URL
        sync: false
